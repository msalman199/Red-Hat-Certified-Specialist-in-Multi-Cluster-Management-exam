# network-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-network-config
  namespace: managed-cluster-01
data:
  network-config.yaml: |
    networking:
      networkType: OVNKubernetes
      clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
      serviceNetwork:
      - 172.30.0.0/16
      machineNetwork:
      - cidr: 10.0.0.0/16
