apiVersion: v1
kind: Pod
metadata:
  name: compliant-test-pod
  namespace: default
spec:
  containers:
  - name: test
    image: nginx
    securityContext:
      privileged: false
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
