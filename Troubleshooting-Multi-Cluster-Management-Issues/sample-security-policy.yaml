apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: security-policy
  namespace: default
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: security-policy-config
      spec:
        remediationAction: inform
        severity: high
        object-templates:
        - complianceType: mustnothave
          objectDefinition:
            apiVersion: v1
            kind: Pod
            metadata:
              namespace: default
            spec:
              containers:
              - name: test
                securityContext:
                  privileged: true
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: security-policy-binding
  namespace: default
placementRef:
  name: security-policy-placement
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
- name: security-policy
  kind: Policy
  apiGroup: policy.open-cluster-management.io
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: security-policy-placement
  namespace: default
spec:
  clusterSelector:
    matchLabels: {}
