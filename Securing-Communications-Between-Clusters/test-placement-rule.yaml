apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: test-tls-placement
  namespace: default
spec:
  clusterConditions:
  - status: "True"
    type: ManagedClusterConditionAvailable
  clusterSelector:
    matchExpressions:
    - key: name
      operator: In
      values:
      - managed-cluster-1
      - managed-cluster-2
