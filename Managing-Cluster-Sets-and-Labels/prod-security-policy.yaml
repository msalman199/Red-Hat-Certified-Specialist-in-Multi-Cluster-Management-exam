# Create file: prod-security-policy.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: prod-security-policy
  namespace: cluster-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.AC Identity Management Authentication and Access Control
    policy.open-cluster-management.io/controls: PR.AC-1,PR.AC-4
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: prod-pod-security-policy
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            exclude:
              - kube-*
              - openshift-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: LimitRange
                metadata:
                  name: prod-resource-limits
                  namespace: default
                spec:
                  limits:
                    - default:
                        cpu: "500m"
                        memory: "512Mi"
                      defaultRequest:
                        cpu: "100m"
                        memory: "128Mi"
                      type: Container
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: prod-network-policy
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            exclude:
              - kube-*
              - openshift-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: strict-network-policy
                  namespace: default
                spec:
                  podSelector: {}
                  policyTypes:
                    - Ingress
                    - Egress
                  ingress: []
                  egress:
                    - to:
                        - namespaceSelector:
                            matchLabels:
                              name: kube-system
                      ports:
                        - protocol: TCP
                          port: 53
                        - protocol: UDP
                          port: 53
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: prod-security-policy-binding
  namespace: cluster-policies
placementRef:
  name: prod-placement
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: prod-security-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: prod-placement
  namespace: cluster-policies
spec:
  clusterSelector:
    matchLabels:
      environment: production
      criticality: high
