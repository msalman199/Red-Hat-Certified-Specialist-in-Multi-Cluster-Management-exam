apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-compliance-report
  namespace: policy-automation
data:
  query.sh: |
    #!/bin/bash
    echo "=== Policy Compliance Report ==="
    echo "Generated on: $(date)"
    echo ""
    
    echo "=== Policy Status Overview ==="
    oc get policy -n policy-automation -o custom-columns=NAME:.metadata.name,STATUS:.status.compliant,REMEDIATION:.spec.remediationAction
    echo ""
    
    echo "=== Detailed Compliance by Cluster ==="
    for cluster in $(oc get managedcluster -o jsonpath='{.items[*].metadata.name}'); do
      echo "--- Cluster: $cluster ---"
      oc get policy.policy.open-cluster-management.io -n $cluster 2>/dev/null || echo "No policies found for $cluster"
      echo ""
    done
