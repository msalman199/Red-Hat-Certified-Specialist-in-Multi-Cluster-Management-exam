apiVersion: v1
kind: Pod
metadata:
  name: privileged-test-pod
  namespace: policy-test
spec:
  containers:
    - name: test-container
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
