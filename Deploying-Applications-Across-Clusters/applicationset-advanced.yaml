apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-advanced-applicationset
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: dev-cluster
        url: https://kubernetes.default.svc
        namespace: guestbook-dev
        environment: dev
        path: overlays/dev
      - cluster: staging-cluster
        url: https://kubernetes.default.svc
        namespace: guestbook-staging
        environment: staging
        path: overlays/staging
      - cluster: prod-cluster
        url: https://kubernetes.default.svc
        namespace: guestbook-prod
        environment: production
        path: overlays/prod
  template:
    metadata:
      name: '{{cluster}}-guestbook-advanced'
      labels:
        environment: '{{environment}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{url}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
