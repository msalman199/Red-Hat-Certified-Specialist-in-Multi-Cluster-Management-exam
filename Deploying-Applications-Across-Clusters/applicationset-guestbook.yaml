apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-applicationset
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/your-username/multi-cluster-apps.git
      revision: HEAD
      files:
      - path: "clusters/*.yaml"
  template:
    metadata:
      name: '{{metadata.name}}-guestbook'
      labels:
        environment: '{{metadata.labels.environment}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/your-username/multi-cluster-apps.git
        targetRevision: HEAD
        path: apps/guestbook
      destination:
        server: '{{spec.server}}'
        namespace: '{{spec.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
