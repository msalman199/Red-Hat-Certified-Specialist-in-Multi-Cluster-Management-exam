apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: health-demo-app
  namespace: health-demo
  annotations:
    apps.open-cluster-management.io/deployables: ""
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Deployable
  descriptor: {}
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - health-demo-app
---
apiVersion: apps.open-cluster-management.io/v1
kind: Deployable
metadata:
  name: health-demo-deployable
  namespace: health-demo
  labels:
    app: health-demo-app
spec:
  template:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: health-demo-app
      labels:
        app: health-demo
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: health-demo
      template:
        metadata:
          labels:
            app: health-demo
        spec:
          containers:
          - name: web-server
            image: nginx:1.21
            ports:
            - containerPort: 80
            livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 30
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 5
              periodSeconds: 5
