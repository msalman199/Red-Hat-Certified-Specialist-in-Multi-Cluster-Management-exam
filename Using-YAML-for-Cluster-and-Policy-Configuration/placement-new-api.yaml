apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-new-api-example
  namespace: default
spec:
  numberOfClusters: 2
  clusterSets:
    - development
    - production
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            environment: development
        claimSelector:
          matchLabels:
            region.open-cluster-management.io/us-east-1: ""
  prioritizerPolicy:
    mode: Exact
    configurations:
      - scoreCoordinate:
          type: BuiltIn
          builtIn: ResourceAllocatableCPU
        weight: 1
