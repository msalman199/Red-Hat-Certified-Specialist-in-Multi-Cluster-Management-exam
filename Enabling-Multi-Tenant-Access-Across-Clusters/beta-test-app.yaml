apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-api-app
  namespace: tenant-beta
  labels:
    app: beta-api
    tenant: beta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beta-api
  template:
    metadata:
      labels:
        app: beta-api
        tenant: beta
    spec:
      containers:
      - name: api
        image: nginx:1.21
        ports:
        - containerPort: 80
        env:
        - name: TENANT
          value: "beta"

---
apiVersion: v1
kind: Service
metadata:
  name: beta-api-service
  namespace: tenant-beta
  labels:
    tenant: beta
spec:
  selector:
    app: beta-api
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
